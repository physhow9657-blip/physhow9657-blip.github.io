name: Deploy to GitHub Pages

# main 브랜치에 push 하면 자동으로 빌드해서 GitHub Pages 에 배포합니다.
# 이 저장소는 사용자 페이지(physhow9657-blip.github.io)이므로 BASE_PATH 는 '/' 입니다.
#
# 최초 배포: 저장소에 push 만 하면 됩니다. Pages 가 아직 꺼져 있으면
# actions/configure-pages 의 enablement 옵션이 자동으로 켭니다.
# (자동으로 켜지지 않는 환경이면 저장소 Settings → Pages → Source = GitHub Actions)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro)
        run: npm run build
        env:
          # 사용자 페이지(루트 주소) 배포
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /
          # 프로젝트 페이지로 배포한다면 BASE_PATH: /${{ github.event.repository.name }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Pages 가 꺼져 있으면 이 단계에서 자동으로 켭니다.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
