name: Deploy to GitHub Pages

# main 브랜치에 push 하면 자동으로 빌드해서 GitHub Pages 에 배포합니다.
#
# 저장소 이름에 따라 배포 경로가 자동으로 정해집니다.
#   - physhow9657-blip.github.io  → https://physhow9657-blip.github.io/        (BASE_PATH "/")
#   - 그 밖의 이름(예: jin)        → https://physhow9657-blip.github.io/jin/   (BASE_PATH "/jin")
#
# 최초 배포: push 만 하면 됩니다. Pages 가 아직 꺼져 있으면
# actions/configure-pages 의 enablement 옵션이 자동으로 켭니다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Determine site URL and base path
        run: |
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          if [ "${GITHUB_EVENT_REPOSITORY_NAME}" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            BASE_PATH="/"
          else
            BASE_PATH="/${GITHUB_EVENT_REPOSITORY_NAME}"
          fi
          echo "SITE_URL=${SITE_URL}" >> "$GITHUB_ENV"
          echo "BASE_PATH=${BASE_PATH}" >> "$GITHUB_ENV"
          echo "SITE_URL=${SITE_URL} / BASE_PATH=${BASE_PATH}"
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Pages 가 꺼져 있으면 이 단계에서 자동으로 켭니다.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
